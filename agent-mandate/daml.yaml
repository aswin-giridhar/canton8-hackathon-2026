# Templates only. NO daml-script dependency, so this package is upgradable and
# can be referenced by name (#agent-mandate) rather than by package id.
#
# The splice-api-token-* DARs come from the LocalNet bundle and give us the
# real token standard interfaces, so Charge can move Amulet rather than our
# own Purse template.
sdk-version: 3.4.10
name: agent-mandate
source: daml
version: 0.0.1
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - /home/aswin/localnet/splice-node/dars/splice-api-token-metadata-v1-current.dar
  - /home/aswin/localnet/splice-node/dars/splice-api-token-holding-v1-current.dar
  - /home/aswin/localnet/splice-node/dars/splice-api-token-transfer-instruction-v1-current.dar
build-options:
  - --target=2.1
