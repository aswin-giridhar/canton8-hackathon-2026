# Templates only. NO daml-script dependency, so this package is upgradable and
# can be referenced by name (#agent-mandate) rather than by package id, and
# uploading it does not drag daml-script into the participant's package store.
sdk-version: 3.4.10
name: agent-mandate
source: daml
version: 0.0.1
dependencies:
  - daml-prim
  - daml-stdlib
build-options:
  - --target=2.1
